name: BusGo CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BusGo.csproj

    - name: Build Release
      run: dotnet build BusGo.csproj -c Release --no-restore

    - name: Publish
      run: dotnet publish BusGo.csproj -c Release -o ./publish /p:UseAppHost=false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image test
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: busgo:latest
